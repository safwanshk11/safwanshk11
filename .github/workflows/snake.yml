name: Generate Contribution Snake

on:
  # Run manually from the Actions tab.
  workflow_dispatch:
  # Run once every 24 hours (03:00 UTC).
  schedule:
    - cron: "0 3 * * *"
  # Also regenerate whenever the profile itself changes.
  push:
    branches: [main]

# Least privilege by default; the job below opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish snake SVGs
    runs-on: ubuntu-latest

    permissions:
      # Required only to push the generated SVGs to the `output` branch.
      contents: write

    steps:
      - name: Generate light and dark snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#EBEDF0,#B7E9F7,#5FD3F3,#00E5FF,#00B8D4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#161B22,#3A2E63,#5B3FA8,#7B52D3,#8B5CF6

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
