      <text x="50" y="290" font-size="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#6E7F92">Agents that plan, act and check their own work</text>
      <rect x="30" y="316" width="500" height="104" rx="12" fill="url(#mmRow)" stroke="#1F2A39"/>
      <rect x="30" y="316" width="3.5" height="104" rx="2" fill="#8B5CF6"/>
      <text x="50" y="347" font-size="14" fill="#8B5CF6" opacity="0.8">03</text>
      <circle cx="88" cy="342" r="5.5" fill="#8B5CF6"></circle>
