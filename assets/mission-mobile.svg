      <text x="477.5" y="346" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#8B5CF6">ONGOING</text>
      <text x="50" y="382" font-size="19" font-weight="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#E6EDF3">Strengthening DSA and system design</text>
      <text x="50" y="406" font-size="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#6E7F92">100+ LeetCode problems solved and counting</text>
      <rect x="30" y="432" width="500" height="104" rx="12" fill="url(#mmRow)" stroke="#1F2A39"/>
      <rect x="30" y="432" width="3.5" height="104" rx="2" fill="#39FF88"/>
      <text x="50" y="463" font-size="14" fill="#39FF88" opacity="0.8">04</text>
      <circle cx="88" cy="458" r="5.5" fill="#39FF88"></circle>
      <rect x="462" y="446" width="54" height="24" rx="12" fill="#39FF88" fill-opacity="0.14" stroke="#39FF88" stroke-opacity="0.55"/>
      <text x="489.0" y="462" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#39FF88">OPEN</text>
      <text x="50" y="498" font-size="19" font-weight="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#E6EDF3">Contributing to open source</text>
      <text x="50" y="522" font-size="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#6E7F92">Selected contributor, GirlScript Summer of Code 2026</text>
