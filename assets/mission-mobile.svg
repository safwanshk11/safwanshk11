<svg xmlns="http://www.w3.org/2000/svg" width="560" height="564" viewBox="0 0 560 564" role="img" aria-label="Current mission: shipping useful full-stack products (active); exploring agentic AI and automation (in progress); strengthening DSA and system design, 100 plus LeetCode problems solved (ongoing); contributing to open source as a GirlScript Summer of Code 2026 contributor (open).">
  <title>Current Mission — live status board</title>
  <defs>
    <linearGradient id="mmSurface" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0E1520"/><stop offset="100%" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="mmRow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#131C28"/><stop offset="100%" stop-color="#0C121B"/>
    </linearGradient>
    <radialGradient id="mmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.13"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mmCard"><rect width="560" height="564" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#mmCard)">
