      <text x="50" y="174" font-size="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#6E7F92">Complete systems with a real backend and real users</text>
      <rect x="30" y="200" width="500" height="104" rx="12" fill="url(#mmRow)" stroke="#1F2A39"/>
      <rect x="30" y="200" width="3.5" height="104" rx="2" fill="#00E5FF"/>
      <text x="50" y="231" font-size="14" fill="#00E5FF" opacity="0.8">02</text>
      <circle cx="88" cy="226" r="5.5" fill="#00E5FF"></circle>
      <rect x="409" y="214" width="107" height="24" rx="12" fill="#00E5FF" fill-opacity="0.14" stroke="#00E5FF" stroke-opacity="0.55"/>
