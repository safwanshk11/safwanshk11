<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="212" viewBox="0 0 1000 212" role="img" aria-label="Philosophy: great software should do more than respond — it should understand the problem, take action, and verify the result.">
  <title>Developer philosophy</title>

  <defs>
    <linearGradient id="pSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1621"/>
      <stop offset="50%" stop-color="#0B1119"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>
    <linearGradient id="pBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pCard"><rect width="1000" height="212" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#pCard)">
    <rect width="1000" height="212" fill="url(#pSurface)"/>
    <ellipse cx="150" cy="200" rx="360" ry="170" fill="url(#pGlow2)"/>
    <ellipse cx="860" cy="10"  rx="360" ry="170" fill="url(#pGlow)"/>

    <!-- accent bar + oversized quote mark -->
    <rect x="40" y="46" width="4" height="120" rx="2" fill="url(#pBar)"/>
    <text x="72" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#1E2A3A">&#8220;</text>

    <text text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <tspan x="516" y="92" font-size="25" fill="#C9D1D9">Great software should do more than respond &#8212;</tspan>
      <tspan x="516" y="132" font-size="25" fill="#C9D1D9">it should <tspan font-weight="700" fill="#00E5FF">understand</tspan> the problem, <tspan font-weight="700" fill="#8B5CF6">take action</tspan>, and <tspan font-weight="700" fill="#39FF88">verify</tspan> the result.</tspan>
    </text>

    <line x1="430" y1="166" x2="490" y2="166" stroke="#243244"/>
    <rect x="494" y="160" width="12" height="12" rx="2" transform="rotate(45 500 166)" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
    <line x1="510" y1="166" x2="570" y2="166" stroke="#243244"/>

    <rect x="0.75" y="0.75" width="998.5" height="210.5" rx="18" fill="none" stroke="#232E3D" stroke-width="1.5"/>
  </g>
</svg>
