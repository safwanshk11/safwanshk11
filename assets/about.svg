      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="aTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121A26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D141E" stop-opacity="0.95"/>
