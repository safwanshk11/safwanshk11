<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" role="img" aria-label="About panel: based in Chennai India; studying CSE at Chennai Institute of Technology; building developer tools, AI automation and full-stack products; sharpening DSA, system design and backend engineering; open to software engineering internships and open-source collaboration; contact safwanshk11 at gmail dot com.">
  <title>About — status panel</title>

  <defs>
