<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Cyan and purple wave divider closing the profile">
  <title>Closing wave divider</title>

  <defs>
    <linearGradient id="fWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="fHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.9;0.7;-0.9" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.05;1.65;0.05" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fCard"><rect width="1000" height="170" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#fCard)">
    <rect width="1000" height="170" fill="#0B111A"/>
    <ellipse cx="500" cy="170" rx="520" ry="130" fill="url(#fGlow)"/>

    <!-- diamond motif, echoing the hero -->
    <line x1="360" y1="44" x2="480" y2="44" stroke="#1F2A38"/>
    <rect x="494" y="38" width="12" height="12" rx="2" transform="rotate(45 500 44)" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.4"/>
    <line x1="520" y1="44" x2="640" y2="44" stroke="#1F2A38"/>

    <path d="M0 116 C 150 74, 300 152, 500 112 C 700 72, 850 138, 1000 102 L1000 170 L0 170 Z" fill="url(#fFill)"/>
    <path d="M0 142 C 170 106, 330 172, 530 138 C 730 104, 870 158, 1000 132"
          fill="none" stroke="url(#fWave)" stroke-width="1.2" stroke-opacity="0.40" stroke-linecap="round"/>
    <path d="M0 132 C 170 94, 320 166, 520 128 C 720 90, 860 150, 1000 120"
          fill="none" stroke="url(#fWave)" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="0" y="166" width="1000" height="2" fill="url(#fHair)"/>
  </g>
</svg>
