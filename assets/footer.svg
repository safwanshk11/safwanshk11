<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Decorative cyan and purple wave divider">
  <title>Decorative cyan and purple wave divider</title>

  <defs>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0.6;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.6;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="footGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="foot">
      <rect x="0" y="0" width="1000" height="150" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#foot)">
    <rect width="1000" height="150" fill="#0D1117"/>
    <ellipse cx="500" cy="150" rx="520" ry="120" fill="url(#footGlow)"/>

    <path d="M0 96 C 150 52, 300 132, 500 92 C 700 52, 850 118, 1000 82 L1000 150 L0 150 Z"
          fill="url(#waveB)"/>
    <path d="M0 122 C 170 86, 330 152, 530 118 C 730 84, 870 138, 1000 112"
          fill="none" stroke="url(#waveA)" stroke-width="1.2" stroke-opacity="0.40" stroke-linecap="round"/>
    <path d="M0 112 C 170 74, 320 146, 520 108 C 720 70, 860 130, 1000 100"
          fill="none" stroke="url(#waveA)" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="0" y="146" width="1000" height="2" fill="url(#hairline)"/>
  </g>
</svg>
