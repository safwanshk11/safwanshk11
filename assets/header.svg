<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Safwan Shaik — Software Engineer in the Making. Full-stack, AI automation, security.">
  <title>Safwan Shaik — Software Engineer in the Making</title>

  <defs>
    <linearGradient id="hSurface" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0F1620"/>
      <stop offset="55%" stop-color="#0B111A"/>
      <stop offset="100%" stop-color="#080C13"/>
    </linearGradient>

    <linearGradient id="hMark" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="38%"  stop-color="#67E8F9"/>
      <stop offset="68%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="hScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="58%"  stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.9;0.75;-0.9" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.05;1.7;0.05"  dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="hGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hGlowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#141C27" stroke-width="1"/>
    </pattern>

    <clipPath id="hCard"><rect x="0" y="0" width="1000" height="330" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#hCard)">
    <rect width="1000" height="330" fill="url(#hSurface)"/>
    <rect width="1000" height="330" fill="url(#hGrid)"/>

    <ellipse cx="190" cy="60"  rx="420" ry="250" fill="url(#hGlowC)"/>
    <ellipse cx="830" cy="285" rx="430" ry="255" fill="url(#hGlowP)"/>

    <!-- circuit traces -->
    <g stroke="#1C2735" stroke-width="1.25" fill="none">
      <path d="M0 84 H196 L226 54 H392"/>
      <path d="M1000 250 H812 L782 280 H598"/>
      <path d="M0 268 H128 L152 244"/>
      <path d="M1000 70 H902 L880 92"/>
    </g>
    <g fill="#00E5FF" opacity="0.5">
      <circle cx="392" cy="54" r="2.6"/><circle cx="152" cy="244" r="2.6"/>
    </g>
    <g fill="#8B5CF6" opacity="0.5">
      <circle cx="598" cy="280" r="2.6"/><circle cx="880" cy="92" r="2.6"/>
    </g>

    <!-- animated scan rule -->
    <rect x="0" y="0" width="1000" height="2" fill="url(#hScan)"/>

    <!-- corner brackets -->
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M40 68 L40 46 L62 46" stroke="#00E5FF" stroke-opacity="0.6"/>
      <path d="M960 68 L960 46 L938 46" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <path d="M40 262 L40 284 L62 284" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <path d="M960 262 L960 284 L938 284" stroke="#00E5FF" stroke-opacity="0.6"/>
    </g>

    <!-- eyebrow -->
    <text x="500" y="98" text-anchor="middle"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="14" letter-spacing="7" fill="#5B6B7F">CHENNAI, INDIA</text>

    <!-- wordmark -->
    <text x="500" y="176" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="70" font-weight="700" letter-spacing="7" fill="url(#hMark)">SAFWAN SHAIK</text>

    <!-- rule with centre diamond -->
    <line x1="330" y1="204" x2="470" y2="204" stroke="#243244" stroke-width="1"/>
    <line x1="530" y1="204" x2="670" y2="204" stroke="#243244" stroke-width="1"/>
    <rect x="494" y="198" width="12" height="12" rx="2" transform="rotate(45 500 204)" fill="none" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="1.5"/>

    <text x="500" y="240" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="21" font-weight="600" letter-spacing="6" fill="#C9D1D9">SOFTWARE ENGINEER IN THE MAKING</text>

    <!-- HUD status strip -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5">
      <rect x="248" y="288" width="504" height="1" fill="#1B2532"/>
      <circle cx="286" cy="311" r="4" fill="#00E5FF"/>
      <text x="299" y="316" fill="#7D8FA3">FULL-STACK</text>
      <circle cx="440" cy="311" r="4" fill="#8B5CF6"/>
      <text x="453" y="316" fill="#7D8FA3">AI AUTOMATION</text>
      <circle cx="638" cy="311" r="4" fill="#39FF88"/>
      <text x="651" y="316" fill="#7D8FA3">SECURITY</text>
    </g>

    <rect x="0.75" y="0.75" width="998.5" height="328.5" rx="20" fill="none" stroke="#26313F" stroke-width="1.5"/>
  </g>
</svg>
