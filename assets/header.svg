<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Safwan Shaik — Software Engineer in the Making">
  <title>Safwan Shaik — Software Engineer in the Making</title>

  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0.6;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.6;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="#0D1117"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <ellipse cx="170" cy="80" rx="380" ry="220" fill="url(#glowCyan)"/>
    <ellipse cx="850" cy="215" rx="400" ry="230" fill="url(#glowPurple)"/>

    <!-- animated accent rule (the single animated element in this banner) -->
    <rect x="0" y="0" width="1000" height="2" fill="url(#rule)"/>

    <!-- corner brackets -->
    <path d="M36 58 L36 40 L54 40" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M964 58 L964 40 L946 40" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 222 L36 240 L54 240" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M964 222 L964 240 L946 240" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

    <text x="500" y="122" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="64" font-weight="700" letter-spacing="8" fill="url(#wordmark)">SAFWAN SHAIK</text>

    <line x1="390" y1="152" x2="610" y2="152" stroke="#30363D" stroke-width="1"/>

    <text x="500" y="186" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="600" letter-spacing="6" fill="#C9D1D9">SOFTWARE ENGINEER IN THE MAKING</text>

    <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2">
      <circle cx="332" cy="222" r="3.5" fill="#00E5FF"/>
      <text x="344" y="227" fill="#8B949E">FULL-STACK</text>

      <circle cx="470" cy="222" r="3.5" fill="#8B5CF6"/>
      <text x="482" y="227" fill="#8B949E">AI AUTOMATION</text>

      <circle cx="638" cy="222" r="3.5" fill="#39FF88"/>
      <text x="650" y="227" fill="#8B949E">SECURITY</text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#30363D"/>
  </g>
</svg>
